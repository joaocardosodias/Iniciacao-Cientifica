[package]
name = "generate_test_files"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Fast fake test-file generator (xlsx/docx/pdf/txt) for the evasion experiments"

[[bin]]
name = "generate_test_files"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
